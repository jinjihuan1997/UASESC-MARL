env: uav_escs_sc
env_name: semantic_video_acquisition_fixed_multiobj

# Episode and topology
T: 600.0
delta_T: 1.0
n_uav: 3
n_ds: 30
map_size: [6000.0, 6000.0, 600.0]
sut_height_m: 10.0
uav_altitude_m: 100.0
uav_min_distance_to_sut_m: 1000.0
ds_uav_service_radius_m: 100.0
ds_height_m: 1.5

# Transparent UAV-SUT-satellite-RCC backhaul
B_uav_sut: 120000.0
B_sut_sat: 100000.0
B_ds_uav: 20000000.0
f_uav_sut_hz: 2400000000.0
f_sut_sat_hz: 14000000000.0
f_ds_uav_hz: 2400000000.0
p_uav_sut_w: 0.2
p_sut_sat_w: 1.0
p_ds_uav_w: 0.1
g_uav_sut_tx_db: 0.0
g_uav_sut_rx_db: 0.0
g_sut_sat_tx_db: 25.0
g_sut_sat_rx_db: 15.0
g_ds_uav_tx_db: 0.0
g_ds_uav_rx_db: 0.0
nf_uav_sut_db: 7.0
nf_sut_sat_db: 3.0
nf_ds_uav_db: 7.0
sigma_uav_sut: 3.0
sigma_sut_sat: 1.0
sigma_ds_uav: 4.0
atg_los_a: 12.08
atg_los_b: 0.11
atg_eta_los_db: 1.6
atg_eta_nlos_db: 23.0
satellite_altitude_m: 550000.0
satellite_slant_range_m: 550000.0
beta_sat_lower_bound: 0.05

# Semantic video stream model
use_semcom_registry: true
# Semantic modes cover fixed-SNR checkpoints at 0/5/10/15 dB and
# mu_comm quality/load tradeoff points 1e-4/5e-4/1e-3/2e-3 at each SNR.
semantic_model_set: ran_adaptive_snr0_15_mu_grid_16modes
# Optional override. Empty means use harl/envs/uav_escs/semantic_models/semcom_model_sets.json.
semantic_registry_path: ""
# Optional offline CRL-SemCom profile generated from real validation data.
# Empty keeps the metadata surrogate in semantic_registry.py.
semantic_profile_path: "profiles/derived_coupled_profile_snr0_20.npz"
semantic_profile_quality_metric: psnr
n_semantic_modes: 16
# Raw VIDI source video before SCI/SemCom training preprocessing.
raw_video_h: 720
raw_video_w: 1280
raw_video_l: 32
raw_video_channels: 3
# SCI/SemCom checkpoint input geometry after extraction, resize, and grayscale conversion.
video_h: 256
video_w: 256
video_l: 16
video_channels: 1
raw_sample_bits: 8.0
sci_sensor_channels: 24
sci_bits_per_sample: 8.0
semantic_channels: 48
semantic_rate_level: [1.0, 2.0, 3.0, 4.0]
semantic_quality_bias_db: [-1.5, -0.3, 0.8, 1.5]
semantic_content_sensitivity: [0.6, 0.45, 0.3, 0.2]
n_z_base_scale: 12.0
content_feature_dim: 3
# UAV action uses mu_logits plus legacy 3-D [alpha_A, alpha_Q, alpha_Lambda]
# scheduling-control weights by default. Set true to use per-local-DS logits.
use_direct_ds_logits: false
scheduling_weight_transform: softmax

# Instruction-conditioned constraints. UAV action remains
# [mu_logits(4), scheduling_weights(3)]; the environment applies
# feasibility projection and budget-aware greedy scheduling.
num_instructions: 3
instruction_names: ["balance", "aoi", "quality"]
use_instruction_constraints: true
instruction_mode_strategy: "random_switch_once"
fixed_instruction_id: 0
instruction_candidates: [0, 1, 2]
instruction_switch_step: 200
instruction_switch_min_step: 200
instruction_switch_max_step: 400
instruction_before_id: 0
instruction_after_id: 1
instruction_after_id_candidates: [1, 2]
instruction_before_candidates: [0]
instruction_after_candidates: [1, 2]
allow_same_instruction_after_switch: false
include_instruction_id_in_obs: true
include_instruction_constraints_in_obs: true
Q_min_eval: 21.0
# Per-instruction PSNR floors by SNR bucket. Recalibrated to the derived_coupled
# profile, whose best mode (sci2+rate3) reaches ~28.7/31.2/32.3/32.8 dB across the
# four ascending SNR buckets:
#   balance  - moderate floor, satisfiable by the mid mode (sci1+rate2);
#   aoi      - low floor so the policy may trade quality away for freshness;
#   quality  - just below the per-bucket ceiling so the floor BINDS and forces
#              the top mode (sci2+rate3). Re-verify with a short eval.
Q_req_by_instruction_snr_bucket:
  - [25.0, 27.0, 28.0, 29.0]
  - [22.0, 24.0, 25.0, 26.0]
  - [28.0, 30.5, 31.5, 32.0]
# Recalibrated against fixed-instruction rollouts. balance and aoi remain tight;
# quality is wider but still same-order, with a lower AoI violation weight below
# so high-Q behavior is discouraged from starving freshness without being dominated.
A_limit_by_instruction: [7.6, 6.0, 15.0]
A_limit_context_ref: 15.0
# Freshness needs more backhaul, not less: give the aoi instruction extra budget
# (was 0.9, which counterproductively starved scheduling) and keep quality high
# so it can afford higher-rate semantic modes.
Lambda_budget_ratio_by_instruction: [1.0, 1.15, 1.1]
constraint_penalty_Q: 1.0
constraint_penalty_A: 0.5
constraint_penalty_A_by_instruction: [0.5, 0.5, 0.05]
constraint_penalty_Lambda: 0.1
eta_recv_aoi_bonus: 0.1
use_snr_bucket_mode_mask: true
use_quality_feasibility_mask: true
use_load_feasibility_mask: false

# Fixed multi-objective reward
# Recalibrated to the derived_coupled profile range (PSNR ~21.7-32.8 dB):
# Q_min below the worst-mode floor, Q_max at the best-mode ceiling so the
# quality_gain term spans [0,1] across the new mode ladder.
Q_min: 21.0
omega_Q: 0.50
omega_Lambda: 0.10
omega_A: 0.40
aoi_mean_weight: 0.4
aoi_max_weight: 0.3
aoi_tail_weight: 0.3
aoi_tail_threshold: 10.0
Q_max: 33.0
Lambda_ref: 100000.0
A_max: 600.0

# Cache initialization
initial_cache_prob: 1.0
initial_aoi: 1.0
