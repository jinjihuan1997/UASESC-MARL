env: uav_escs_cc
env_name: semantic_video_acquisition_fixed_multiobj

# Conventional H.264/LDPC baseline under the same UAV-ESCS Dec-POMDP
# interface. UAV action remains [mu_logits(4), scheduling_weights(3)].
T: 600.0
delta_T: 1.0
n_uav: 3
n_ds: 30
map_size: [6000.0, 6000.0, 600.0]
sut_height_m: 10.0
uav_altitude_m: 100.0
uav_min_distance_to_sut_m: 1000.0
ds_uav_service_radius_m: 100.0
ds_height_m: 1.5
B_uav_sut: 120000.0
B_sut_sat: 100000.0
B_ds_uav: 20000000.0
f_uav_sut_hz: 2400000000.0
f_sut_sat_hz: 14000000000.0
f_ds_uav_hz: 2400000000.0
p_uav_sut_w: 0.2
p_sut_sat_w: 1.0
p_ds_uav_w: 0.1
g_uav_sut_tx_db: 0.0
g_uav_sut_rx_db: 0.0
g_sut_sat_tx_db: 25.0
g_sut_sat_rx_db: 15.0
g_ds_uav_tx_db: 0.0
g_ds_uav_rx_db: 0.0
nf_uav_sut_db: 7.0
nf_sut_sat_db: 3.0
nf_ds_uav_db: 7.0
sigma_uav_sut: 3.0
sigma_sut_sat: 1.0
sigma_ds_uav: 4.0
atg_los_a: 12.08
atg_los_b: 0.11
atg_eta_los_db: 1.6
atg_eta_nlos_db: 23.0
satellite_altitude_m: 550000.0
satellite_slant_range_m: 550000.0
beta_sat_lower_bound: 0.05
n_semantic_modes: 5
use_semcom_registry: false
semantic_model_set: h264_ldpc_5modes
semantic_registry_path: ""
cc_codec_name: h264
cc_channel_code_name: ldpc
# Optional offline H.264+LDPC profile from REAL codec + channel simulation
# (scripts/build_cc_h264_ldpc_profile.py). Empty keeps the synthetic fallback
# in uav_escs_env_cc.py. Path is relative to harl/envs/uav_escs/semantic_models/.
# Explicit CC config table exported from the synthetic H.264/LDPC model
# (5 QP modes x SNR grid). Same values as the in-code fallback, now a file.
cc_profile_path: "profiles/cc_h264_ldpc_profile_snr0_20.npz"

# CC calibration target. CRL-SemCom-VidCI prepares VIDI clips as
# 256x256, 32-frame blocks, so the conventional H.264/LDPC load table is
# calibrated on the same processed clip scale rather than the original 720p
# source. The raw_video_* fields below are kept as source metadata.
cc_source_h: 256
cc_source_w: 256
cc_source_l: 32
h264_qp_modes: [42.0, 38.0, 34.0, 30.0, 26.0]
ldpc_code_rate_modes: [0.5, 0.6666667, 0.75, 0.8333333, 0.8333333]
ldpc_required_snr_db: [-1.0, 2.0, 5.0, 8.0, 8.0]
h264_ref_qp: 42.0
# Calibrated so round-robin CC serves a similar number of streams as SC under
# the same UAV/SUT topology while preserving H.264/LDPC's lower quality-load
# efficiency.
h264_ref_bpp: 0.010
h264_content_bpp_gain: 0.60
h264_ref_psnr_db: 28.0
h264_psnr_per_qp_step_db: 0.55
h264_content_psnr_penalty_db: 1.20
cc_header_bits: 512.0
raw_video_h: 720
raw_video_w: 1280
raw_video_l: 32
raw_video_channels: 3
video_h: 256
video_w: 256
video_l: 16
video_channels: 1
raw_sample_bits: 8.0
sci_sensor_channels: 24
sci_bits_per_sample: 8.0
semantic_channels: 48
semantic_rate_level: [1.0, 2.0, 3.0, 4.0]
semantic_quality_bias_db: [-1.5, -0.3, 0.8, 1.5]
semantic_content_sensitivity: [0.6, 0.45, 0.3, 0.2]
n_z_base_scale: 12.0
content_feature_dim: 3
use_direct_ds_logits: false
scheduling_weight_transform: softmax

# Instruction-conditioned constraints. Set --use_instruction_constraints False
# for the no-instruction HAPPO/MAPPO ablation.
num_instructions: 3
instruction_names: ["balance", "aoi", "quality"]
use_instruction_constraints: true
instruction_mode_strategy: random_switch_once
fixed_instruction_id: 0
instruction_candidates: [0, 1, 2]
instruction_switch_step: 200
instruction_switch_min_step: 200
instruction_switch_max_step: 400
instruction_before_id: 0
instruction_before_candidates: [0]
instruction_after_mode_strategy: fixed
instruction_after_id: 1
instruction_after_id_candidates: [1, 2]
instruction_after_candidates: [1, 2]
allow_same_instruction_after_switch: false
include_instruction_id_in_obs: true
include_instruction_constraints_in_obs: true
Q_min_eval: 26.0
A_limit_context_ref: 15.0
# Per-instruction PSNR floors by SNR bucket, recalibrated to the synthetic
# H.264/LDPC model: 5 QP modes at ~27.8/30.0/32.2/34.4/36.6 dB (SNR effect
# small). balance: mid (mode1/2); aoi: low so mode0 always feasible; quality:
# binds toward the top modes (mode3/4) without exceeding the 36.8 ceiling.
# NOTE: mode4 (36.6 dB) needs load 53466 > Phi_bh 33333, so it is unschedulable;
# mode3 (34.4 dB, load 33750) fills the whole budget (1 stream/UAV). Quality is
# therefore aimed at mode2/3 (schedulable with room), NOT mode3/4, to avoid
# backhaul starvation and AoI blow-up.
Q_req_by_instruction_snr_bucket:
  - [28.5, 29.0, 29.5, 30.0]
  - [25.0, 25.5, 26.0, 26.5]
  - [31.0, 31.5, 32.0, 32.5]
# Same scheme as SC: aoi tightest, quality relaxed. The quality instruction's
# higher AoI is its intended trade-off, so its AoI-violation weight is dropped
# (constraint_penalty_A_by_instruction below) instead of inflating A_limit, which
# would de-weight AoI in scheduling (norm_aoi = A_t / A_limit).
A_limit_by_instruction: [7.6, 6.0, 15.0]
Lambda_budget_ratio_by_instruction: [1.0, 1.15, 1.1]
constraint_penalty_Q: 1.0
constraint_penalty_A: 0.5
constraint_penalty_A_by_instruction: [0.5, 0.5, 0.05]
constraint_penalty_Lambda: 0.1
eta_recv_aoi_bonus: 0.1
use_snr_bucket_mode_mask: true
use_quality_feasibility_mask: true
use_load_feasibility_mask: false

# Fixed multi-objective reward
# Recalibrated to synthetic H.264/LDPC range (PSNR ~27-36.8 dB): Q_min below the
# worst QP mode, Q_max at the best-mode ceiling so quality_gain spans [0,1].
Q_min: 26.0
omega_Q: 0.50
omega_Lambda: 0.10
omega_A: 0.40
aoi_mean_weight: 0.4
aoi_max_weight: 0.3
aoi_tail_weight: 0.3
aoi_tail_threshold: 10.0
Q_max: 37.0
Lambda_ref: 100000.0
A_max: 600.0
initial_cache_prob: 1.0
initial_aoi: 1.0
